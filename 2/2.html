<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liwan Color Studio</title>
<style>
*{box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&display=swap');


html,body{
  margin:0;
  min-height:100%;
  font-family:'El Messiri',sans-serif;
    color:#292824;
}
body{
  min-height:100vh;
  background:#f7f7f7 url("liwan-white-background.png") center center / cover fixed no-repeat;
}
.page{min-height:100vh;padding:22px 3.5vw}
.layout{
  width:min(1120px,100%);min-height:calc(100vh - 44px);margin:auto;
  display:grid;grid-template-columns:350px minmax(0,1fr);
  gap:42px;align-items:center;direction:ltr;
}.controls{ 
  direction:rtl; 
  width:360px; 
  padding:0; 
  background:transparent; 
  border:none; 
  box-shadow:none; 
  backdrop-filter:none; 
  -webkit-backdrop-filter:none; 
  transform:translateX(120px);
}

.controls h1{
  color:#fff;
  margin:0 0 6px;
  font-size:20px;
}

.controls .sub{
  color:#b8b5ae;
  margin:0 0 18px;
  font-size:11px;
  line-height:1.7;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.actions button{
  height:44px;
  border:none;
  border-radius:25px;
  background:#B38A3B;
  color:#fff;
  font-family:'El Messiri',sans-serif;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

.actions button:hover{
  background:#C29A4A;
  transform:translateY(-1px);
}

.actions button:last-child{
  background:#8F6D30;
}

.actions button:last-child:hover{
  background:#A27D38;
}
.box{
  border:1px solid #D2CCC3;
  border-radius:13px;
  padding:12px;
  background:#EFE7D1;
}.swap-btn{
  position:relative;
  overflow:hidden;
  width:100%;
  height:48px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#111112;
  color:#fff;
  font-family:'El Messiri',sans-serif;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
  transition:color .25s ease, transform .2s ease;
  z-index:1;
}

/* طبقة اللون الذهبي */
.swap-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:0%;
  height:100%;
  background:#B38A3B;
  transition:width .4s ease;
  z-index:-1;
}

/* عند مرور الماوس */
.swap-btn:hover::before{
  width:100%;
}

.swap-btn:hover{
  color:#fff;
  transform:translateY(-1px);
}

.swap-btn:active{
  transform:translateY(0);
}
h1{font-size:20px;margin:0 0 5px}
.sub{font-size:11px;line-height:1.7;color:#77736d;margin-bottom:18px}
.row{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.box{
  width:100%;
  height:64px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:14px;
  background:#111112;
  border:none;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}
.box h2{
  margin:0;
  min-width:105px;
  font-size:13px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  text-align:right;
  order:1;
}
.box select{
  flex:1;
  height:46px;
  min-width:0;
  padding:0 14px;
  border:none;
  border-radius:9px;
  background:#1c1c1c;
  color:#fff;
  font-family:'El Messiri',sans-serif;
    font-size:13px;
  outline:none;
  cursor:pointer;
  order:2;
}
.box select:focus{
  background:#222;
  box-shadow:0 0 0 1px #A98A42;
}
.chosen{
  display:none;
}
select{
  width:100%;
  height:39px;
  padding:0 9px;
  border:1px solid #C6BEB2;
  border-radius:9px;
  background:#fff;
  color:#292824;
  font-size:13px;
}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px #aaa;flex:none}
.viewer{direction:ltr;display:flex;justify-content:center;align-items:center;min-width:0;position:relative;z-index:2}
.image-area{
  width:min(650px,100%);
  height:calc(100vh - 20px);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  left:120px;
  top:0;
}#product{
  width:131%;
  height:131%;
  object-fit:contain;
  filter:drop-shadow(0 20px 22px #00000018);
}
.info{
  display:none !important;
}
.placeholder{
  position:absolute;inset:10%;display:flex;align-items:center;justify-content:center;
  border:1px dashed #aaa;border-radius:20px;background:#ffffff38;color:#777;
  text-align:center;font-size:12px;line-height:1.8
}
.hidden{display:none!important}
.info{
  position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  white-space:nowrap;background:#ffffffe6;border:1px solid #fff;
  border-radius:20px;padding:6px 11px;font-size:10px;direction:rtl;
  box-shadow:0 5px 15px #00000010
}
@media(max-width:900px){
    .layout{min-height:auto;grid-template-columns:1fr;gap:12px}
  .viewer{order:-1;transform:none}
  .image-area{left:0;top:0}
  .image-area{height:55vh;min-height:330px}
  .controls{max-width:560px;margin:auto}
}
@media(max-width:520px){
  .page{padding:12px}
  .row{grid-template-columns:1fr 1fr;gap:8px}
  .controls{padding:16px}
  .image-area{height:46vh;min-height:280px}
}

/* =========================================================
   LIWAN FINAL RESPONSIVE ADJUSTMENTS
   Same changes as the other Color Studio page
   ========================================================= */

/* LAPTOP: zoom the product only */
@media (min-width:1101px){
  #product{
    width:120% !important;
    height:120% !important;
    max-width:none !important;
    max-height:none !important;
    object-fit:contain !important;
    transform:scale(1.15) !important;
  }
}

/* iPad Pro / large touch tablets:
   bigger controls, shorter product, move product left + up */
@media only screen
  and (hover:none)
  and (pointer:coarse)
  and (min-width:1000px){

  .layout{
    width:100% !important;
    max-width:none !important;
    grid-template-columns:420px minmax(0,1fr) !important;
    gap:0 !important;
    padding:0 3.5vw !important;
  }

  .controls{
    width:420px !important;
    transform:none !important;
  }

  .box{
    height:78px !important;
    padding:10px 12px !important;
    gap:14px !important;
    border-radius:14px !important;
  }

  .box h2{
    min-width:120px !important;
    font-size:15px !important;
  }

  .box select{
    height:56px !important;
    font-size:14px !important;
    padding:0 14px !important;
  }

  .row{
    gap:14px !important;
  }

  .swap-btn{
    height:58px !important;
    font-size:15px !important;
    border-radius:14px !important;
  }

  .viewer{
    width:100% !important;
    min-width:0 !important;
  }

  .image-area{
    width:100% !important;
    max-width:none !important;
    height:82vh !important;
    left:-50px !important;
    top:-40px !important;
  }

  #product{
    width:115% !important;
    height:82% !important;
    max-width:none !important;
    max-height:none !important;
    object-fit:contain !important;
    transform:translate(190px,-10px) scale(1.39) !important;
  }
}

</style>
</head>
<body>
<div class="page">
<main class="layout">
    <section class="controls">
      
      <div class="row">
        <div class="box">
          <h2>اللون الخارجي</h2>
          <select id="outerSelect"></select>
          <div class="chosen"><span id="outerDot" class="dot"></span><span id="outerHex"></span></div>
        </div>
        <div class="box">
          <h2>اللون الداخلي</h2>
          <select id="innerSelect"></select>
          <div class="chosen"><span id="innerDot" class="dot"></span><span id="innerHex"></span></div>
        </div>
      </div>
      <button id="swapColors" class="swap-btn">تبديل الألوان</button>
    </section>

    <section class="viewer">
      <div class="image-area">
        <img id="product" alt="صورة السترة">
        <div id="placeholder" class="placeholder hidden">
          <div>ضع ملف PNG المطابق بجانب صفحة HTML<br>وسيتم عرضه تلقائياً.</div>
        </div>
        <div id="info" class="info"></div>
      </div>
    </section>
  </main>
</div>

<script>
const colors=[{hex:"#E9E4DF",label:"1 — عاجي فاتح"},{hex:"#EFE7D1",label:"2 — بيج فاتح"},{hex:"#C6BEB2",label:"3 — رمادي بيج"},{hex:"#A09C89",label:"4 — زيتوني رمادي"},{hex:"#B2AD99",label:"5 — بيج رمادي"},{hex:"#827C70",label:"6 — رمادي دافئ"},{hex:"#716A5A",label:"7 — رمادي زيتي"},{hex:"#58402D",label:"8 — بني داكن دافئ"},{hex:"#251C17",label:"9 — بني داكن"},{hex:"#6E4B22",label:"10 — بني عسلي"},{hex:"#2B1518",label:"11 — عنابي داكن"},{hex:"#333924",label:"12 — أخضر رمادي داكن"},{hex:"#6A7B73",label:"13 — أخضر رمادي"},{hex:"#232936",label:"14 — أزرق رمادي"},{hex:"#111520",label:"15 — كحلي داكن"},{hex:"#99968F",label:"16 — رمادي فاتح"},{hex:"#B8B8AB",label:"17 — رمادي بيج فاتح"},{hex:"#605F5D",label:"18 — رمادي متوسط"},{hex:"#212226",label:"19 — فحمي"},{hex:"#111112",label:"20 — أسود"}];

const outerSelect=document.getElementById('outerSelect');
const innerSelect=document.getElementById('innerSelect');
const product=document.getElementById('product');
const placeholder=document.getElementById('placeholder');
const info=document.getElementById('info');
const swapColors=document.getElementById('swapColors');

function fillSelect(select){
  colors.forEach((c,i)=>{
    const o=document.createElement('option');
    o.value=i+1;
    o.textContent=String(i+1).padStart(2,'0')+' — '+c.label.split(' — ')[1]+'  '+c.hex;
    select.appendChild(o);
  });
}

function fileName(o,i){
  return 'outer_'+String(o).padStart(2,'0')+'_'+colors[o-1].hex.slice(1)+
         '__inner_'+String(i).padStart(2,'0')+'_'+colors[i-1].hex.slice(1)+'.png';
}

function show(){
  const o=Number(outerSelect.value), i=Number(innerSelect.value);
  const name=fileName(o,i);
  product.src=name;
  product.classList.remove('hidden');
  placeholder.classList.add('hidden');
  document.getElementById('outerDot').style.background=colors[o-1].hex;
  document.getElementById('innerDot').style.background=colors[i-1].hex;
  document.getElementById('outerHex').textContent=colors[o-1].hex;
  document.getElementById('innerHex').textContent=colors[i-1].hex;
  info.textContent='الخارجي '+colors[o-1].hex+'  ·  الداخلي '+colors[i-1].hex;
}

product.onerror=()=>{
  product.classList.add('hidden');
  placeholder.classList.remove('hidden');
  info.textContent='الصورة غير موجودة: '+fileName(Number(outerSelect.value),Number(innerSelect.value));
};

fillSelect(outerSelect);
fillSelect(innerSelect);
outerSelect.value=3;
innerSelect.value=6;
outerSelect.onchange=show;
innerSelect.onchange=show;

swapColors.onclick=()=>{
  const currentOuter=outerSelect.value;
  outerSelect.value=innerSelect.value;
  innerSelect.value=currentOuter;
  show();
};

show();
</script>
</body>
</html>
