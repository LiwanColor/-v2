<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>عارض ألوان السترة</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#202124;background:#f4f3f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}header{background:#24282b;color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:18px}h1{margin:0 0 8px;font-size:clamp(22px,3vw,34px)}.sub{opacity:.78;line-height:1.8}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid #ddd9d2;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0000000b}.viewer{background:#eee;border-radius:14px;overflow:hidden;text-align:center}.viewer img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain}.controls{display:grid;gap:16px}.group{border:1px solid #e3e0da;border-radius:14px;padding:14px}.group h2{font-size:17px;margin:0 0 11px}select{width:100%;padding:11px;border:1px solid #c9c5bd;border-radius:10px;background:#fff;font-size:15px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}button.sw{height:42px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px #bbb;cursor:pointer;position:relative}button.sw.active{box-shadow:0 0 0 3px #202124}button.sw span{position:absolute;inset:auto 2px 2px;font-size:10px;background:#ffffffc9;border-radius:4px;color:#111}.status{background:#f2f0ec;border-radius:10px;padding:11px;font-size:13px;line-height:1.8;direction:rtl}.hint{font-size:12px;color:#6e6b66;line-height:1.8}.error{color:#9b1c1c;background:#fff0f0;border:1px solid #efb2b2}.path{direction:ltr;display:inline-block;font-family:monospace;font-size:11px;word-break:break-all}@media(max-width:780px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body><main class="wrap">
<header><h1>عارض ألوان السترة</h1><div class="sub">اختر اللون الخارجي واللون الداخلي، وستعرض الصفحة الصورة المطابقة مباشرة من ملفات الـ400 صورة الموجودة بجانبها.</div></header>
<section class="grid"><div class="card viewer"><img id="product" alt="صورة السترة باللون المحدد"><div id="status" class="status"></div></div>
<div class="card controls"><div class="group"><h2>اللون الخارجي</h2><select id="outerSelect"></select><div class="swatches" id="outerSwatches"></div></div>
<div class="group"><h2>اللون الداخلي</h2><select id="innerSelect"></select><div class="swatches" id="innerSwatches"></div></div>
<div id="filePath" class="hint"></div><div class="hint">ضع هذا الملف في نفس المجلد مع ملفات الصور الـ400 بعد فك الضغط. لا تضع ملف ZIP فقط؛ يجب فك ضغطه أولًا.</div></div></section></main>
<script>
const colors=[{"hex": "#E9E4DF", "label": "1 — عاجي فاتح"}, {"hex": "#EFE7D1", "label": "2 — بيج فاتح"}, {"hex": "#C6BEB2", "label": "3 — رمادي بيج"}, {"hex": "#A09C89", "label": "4 — زيتوني رمادي"}, {"hex": "#B2AD99", "label": "5 — بيج رمادي"}, {"hex": "#827C70", "label": "6 — رمادي دافئ"}, {"hex": "#716A5A", "label": "7 — رمادي زيتي"}, {"hex": "#58402D", "label": "8 — بني داكن دافئ"}, {"hex": "#251C17", "label": "9 — بني شديد الداكن"}, {"hex": "#6E4B22", "label": "10 — بني عسلي"}, {"hex": "#2B1518", "label": "11 — عنابي داكن"}, {"hex": "#333924", "label": "12 — أخضر رمادي داكن"}, {"hex": "#6A7B73", "label": "13 — أخضر رمادي"}, {"hex": "#232936", "label": "14 — أزرق رمادي"}, {"hex": "#111520", "label": "15 — كحلي داكن"}, {"hex": "#99968F", "label": "16 — رمادي فاتح"}, {"hex": "#B8B8AB", "label": "17 — رمادي بيج فاتح"}, {"hex": "#605F5D", "label": "18 — رمادي متوسط"}, {"hex": "#212226", "label": "19 — فحمي"}, {"hex": "#111112", "label": "20 — أسود"}];
const product=document.getElementById('product'), statusBox=document.getElementById('status'), filePath=document.getElementById('filePath');
const outerSelect=document.getElementById('outerSelect'), innerSelect=document.getElementById('innerSelect');
function fill(select,boxId){const box=document.getElementById(boxId);colors.forEach((c,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=c.label+'  '+c.hex;select.appendChild(o);const b=document.createElement('button');b.className='sw';b.style.background=c.hex;b.title=c.label+' '+c.hex;b.innerHTML='<span>'+String(i+1).padStart(2,'0')+'</span>';b.onclick=()=>{select.value=i+1;show()};box.appendChild(b)})}
function fileName(o,i){return 'outer_'+String(o).padStart(2,'0')+'_'+colors[o-1].hex.slice(1)+'__inner_'+String(i).padStart(2,'0')+'_'+colors[i-1].hex.slice(1)+'.png'}
function show(){const o=+outerSelect.value,i=+innerSelect.value,name=fileName(o,i);product.src=name;filePath.innerHTML='الملف المختار: <span class="path">'+name+'</span>';statusBox.className='status';statusBox.textContent='الخارجي: '+colors[o-1].hex+' — الداخلي: '+colors[i-1].hex;document.querySelectorAll('#outerSwatches .sw').forEach((b,n)=>b.classList.toggle('active',n===o-1));document.querySelectorAll('#innerSwatches .sw').forEach((b,n)=>b.classList.toggle('active',n===i-1))}
product.onerror=()=>{statusBox.className='status error';statusBox.textContent='لم يتم العثور على الصورة. تأكد أن الصفحة موجودة في نفس مجلد ملفات PNG وأنك فككت ملف ZIP.'};
fill(outerSelect,'outerSwatches');fill(innerSelect,'innerSwatches');outerSelect.value=10;innerSelect.value=6;outerSelect.onchange=show;innerSelect.onchange=show;show();
</script></body></html>
