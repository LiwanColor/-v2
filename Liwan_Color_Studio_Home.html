<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liwan Color Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:'El Messiri',sans-serif;
}
body{
  min-height:100vh;
  background:#e9e3db url("liwan-background.png") center center / cover fixed no-repeat;
  color:#292824;
}
.page{
  min-height:100vh;
  padding:40px 3.5vw;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wrap{
  width:min(1050px,100%);
}
.brand{
  text-align:center;
  color:#111112;
  font-size:36px;
  font-weight:600;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  color:#6f6a64;
  font-size:13px;
  margin-bottom:32px;
}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}
.card{
  display:block;
  position:relative;
  min-height:520px;
  overflow:hidden;
  border-radius:18px;
  text-decoration:none;
  background:rgba(255,255,255,.35);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 18px 45px rgba(0,0,0,.12);
  transition:transform .3s ease, box-shadow .3s ease;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 25px 55px rgba(0,0,0,.17);
}
.card img{
  width:100%;
  height:550px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}
.card-body{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 24px 22px;
  background:transparent;
  color:#111112;
  text-align:center;
}

.card-title{
  margin:0 0 4px;
  font-size:20px;
  font-weight:600;
  text-align:center;
}

.card-text{
  margin:0;
  color:#6f6a64;
  font-size:11px;
  line-height:1.8;
  text-align:center;
}
.arrow{
  display:none !important;
}
.note{
  text-align:center;
  margin-top:22px;
  color:#8b857d;
  font-size:10px;
}
@media(max-width:700px){
  .cards{grid-template-columns:1fr}
  .card{min-height:460px}
  .card img{height:360px}
  .brand{font-size:30px}
}
</style>
</head>
<body>
<div class="page">
  <div class="wrap">
    <div class="brand">LIWAN</div>
    <div class="subtitle">اختر التصميم الذي تريد الدخول إليه</div>

    <div class="cards">
      <a class="card" href="1/1.html">
        <img src="card/1.png" alt="التصميم الأول">
        <div class="arrow">←</div>
        <div class="card-body">
        </div>
      </a>

      <a class="card" href="2/2.html">
        <img src="card/2.png" alt="التصميم الثاني">
        <div class="arrow">←</div>
        <div class="card-body">
        </div>
      </a>
    </div>

    <div class="note">Liwan Color Studio</div>
  </div>
</div>
</body>
</html>
